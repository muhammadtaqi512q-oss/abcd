
<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexura - Apne AI Projects Banwao</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Hero Section */
        #hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px 40px;
            transition: all 0.5s ease-in-out;
        }

        #hero-section.hidden {
            display: none;
        }

        .hero-title {
            font-size: 3.2rem;
            margin-bottom: 20px;
            font-weight: 800;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6);
        }

        /* Fullscreen iFrame Container */
        #app-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background-color: var(--bg-color);
        }

        #app-container.active {
            display: block;
        }

        /* Floating Back/Close Button */
        .back-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 101;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">NEXURA</div>
    </header>

    <!-- Hero Section -->
    <section id="hero-section">
        <h1 class="hero-title">Apne Custom AI Projects Banwao</h1>
        <p class="hero-subtitle">Bina kisi jhanjhat ke, automated AI app builder ke zariye apne ideas ko haqeeqat mein badlein.</p>
        <button class="btn-primary" onclick="launchApp()">Apne Projects Banwao</button>
    </section>

    <!-- Full Page iFrame Container -->
    <div id="app-container">
        <button class="back-btn" onclick="closeApp()">← Wapas Jayein</button>
        <iframe
            src="https://muhammad-taqi512-lyra.hf.space"
            frameborder="0">
        </iframe>
    </div>

    <script>
        function launchApp() {
            document.getElementById('hero-section').classList.add('hidden');
            document.getElementById('app-container').classList.add('active');
        }

        function closeApp() {
            document.getElementById('app-container').classList.remove('active');
            document.getElementById('hero-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
